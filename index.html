<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1220">
  <title>hipsad – projects</title>
  <script>
    // Old Sprint Planner share links lived at the site root (/?session=ID); forward them to the new location.
    if (new URLSearchParams(location.search).has('session')) {
      location.replace('sprint-planner/' + location.search + location.hash);
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #eef0fa; overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #3a2a85 0%, #0f1220 60%) fixed;
    }
    main { max-width: 960px; margin: 0 auto; padding: 56px 20px; }
    h1 { font-size: clamp(2rem, 7vw, 3rem); margin: 0 0 8px; }
    .lead { color: #98a0c0; margin: 0 0 36px; font-size: 1.1rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .card {
      display: flex; flex-direction: column; gap: 10px; padding: 24px; text-decoration: none; color: inherit;
      background: #181c30; border: 1px solid #2b3150; border-radius: 16px; transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .card:hover, .card:focus-visible { transform: translateY(-4px); border-color: #8b7bff; box-shadow: 0 12px 30px -12px #8b7bff; outline: none; }
    .icon { font-size: 2.4rem; }
    .card h2 { margin: 0; }
    .card p { margin: 0; color: #98a0c0; flex: 1; }
    .go { color: #8b7bff; font-weight: 700; }
    .tag { align-self: flex-start; font-size: .75rem; background: #20253d; padding: 3px 10px; border-radius: 99px; color: #98a0c0; }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Projects</h1>
    <p class="lead">Small things I build and tinker with.</p>
    <div class="cards">
      <a class="card" href="sprint-planner/">
        <span class="icon" aria-hidden="true">🃏</span>
        <span class="tag">Planning poker</span>
        <h2>Sprint Planning Estimator</h2>
        <p>Real-time shared story point estimation for your team.</p>
        <span class="go">Open →</span>
      </a>
      <a class="card" href="wavelength/">
        <span class="icon" aria-hidden="true">🎯</span>
        <span class="tag">Multiplayer game</span>
        <h2>Wavelength</h2>
        <p>Private rooms, teams of two, a hidden target and a very opinionated dial.</p>
        <span class="go">Play →</span>
      </a>
    </div>
  </main>
</body>
</html>
